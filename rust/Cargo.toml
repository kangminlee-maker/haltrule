# Two crates: the library, which the spec is about, and the adapter, which
# reads the fixtures and prints one line per case. They are apart so that the
# library's dependencies can be counted: sha2 and nothing else.
[workspace]
resolver = "2"
members = ["haltrule", "adapter"]

# The version is the spec's: `spec` answers "haltrule/0" while the spec is a
# draft, so the crate is 0.x and anything may change. Freezing the spec at
# haltrule/1 is what makes it 1.0.0, in every language at once.
[workspace.package]
edition = "2021"
version = "0.0.1"
license = "MIT"
repository = "https://github.com/kangminlee-maker/haltrule"
