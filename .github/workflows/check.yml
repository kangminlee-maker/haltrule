name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # 218 mutants took 16 minutes on a two-CPU runner; 230 will take about 17.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # The spec targets Python 3.10+; 3.12 here is the floor a vendoring
      # project is most likely to be on, not the newest available.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Tools for checking, none of them a dependency of the library. A gate
      # whose tool is missing fails; none is skipped.
      - name: Install dev tools
        run: |
          python -m pip install --quiet ruff==0.14.3
          npm install --no-save --no-audit --no-fund typescript@5 @types/node@24 eslint@10 @typescript-eslint/parser@8

      - name: The gates
        run: ./scripts/check.sh

      # Proves the gates can fail. A suite that has never been seen to fail is
      # a claim, not evidence. scripts/mutants.py plants one defect at a time -
      # in a policy module, an adapter, the driver, a fixture - in its own copy
      # of the tree, and requires check.sh to fail with the evidence that mutant
      # names. It checks the unmutated tree first and proves it can report a
      # survivor.
      - name: Every mutant must make the gates fail with its own evidence
        run: python3 scripts/mutants.py
