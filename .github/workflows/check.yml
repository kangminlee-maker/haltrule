name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The spec targets Python 3.10+; 3.12 here is the floor a vendoring
      # project is most likely to be on, not the newest available.

      - name: Install dev tools
        run: |
          python -m pip install --quiet ruff==0.14.3
          npm install --no-save --no-audit --no-fund typescript@5 @types/node@24

      - name: Deterministic gates
        run: ./scripts/check.sh

      # The gate script skips a tool it cannot find, so a CI run that quietly
      # lost ruff or tsc would still report success. Fail here instead.
      - name: No gate was skipped
        run: |
          ./scripts/check.sh | tee /tmp/gates.txt
          if grep -q '  SKIP  ' /tmp/gates.txt; then
            echo "A gate was skipped in CI, where every tool is installed:"
            grep '  SKIP  ' /tmp/gates.txt
            exit 1
          fi

  # Proves the gates can fail. A suite that has never been seen to fail is a
  # claim, not evidence — so break the implementation on purpose and require
  # the GATE SCRIPT (not just one runner in isolation) to notice, in both
  # languages: a mutant that only ever touched Python leaves the TypeScript
  # comparison path, and everything check.sh does beyond run_fixtures.py
  # (the corruption instrument, the byte-for-byte dump diff, purity,
  # determinism, fixture coverage), completely unexercised by this job.
  gates-detect-a-defect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: |
          python -m pip install --quiet ruff==0.14.3
          npm install --no-save --no-audit --no-fund typescript@5 @types/node@24

      # Every step below credits a failure to its mutation, which only means
      # something if the unmutated tree passes here first.
      - name: The gates pass before any mutation
        run: ./scripts/check.sh

      - name: Break the Python trip threshold, then expect check.sh to fail
        run: |
          python - <<'PY'
          import pathlib
          path = pathlib.Path("py/haltrule/breaker.py")
          source = path.read_text()
          broken = source.replace(
              "len(self._pending_systemic) >= self.policy.systemic_threshold",
              "len(self._pending_systemic) > self.policy.systemic_threshold",
              1,
          )
          assert broken != source, "the mutation did not apply; update this step"
          path.write_text(broken)
          PY
          # Run the actual gate script, not just the runner directly - a
          # mutation step that only shells out to run_fixtures.py proves
          # nothing about whether check.sh itself would have caught it.
          if ./scripts/check.sh > /tmp/mutant-py.txt 2>&1; then
            echo "check.sh passed against a broken Python breaker. The gates are not asserting the trip rule."
            cat /tmp/mutant-py.txt
            exit 1
          fi
          if ! grep -q '  FAIL  python runner exited' /tmp/mutant-py.txt || ! grep -qF 'FAIL [trip_at_threshold_three_rate_limit] field=state.tripped' /tmp/mutant-py.txt; then
            echo "check.sh failed, but python did not report trip_at_threshold_three_rate_limit (state.tripped); the mutation is not what it caught."
            cat /tmp/mutant-py.txt
            exit 1
          fi
          echo "check.sh caught the Python mutation, as it must:"
          grep '  FAIL  ' /tmp/mutant-py.txt
          git checkout -- py/haltrule/breaker.py

      - name: Break the TypeScript trip threshold, then expect check.sh to fail
        run: |
          python - <<'PY'
          import pathlib
          path = pathlib.Path("ts/breaker.ts")
          source = path.read_text()
          broken = source.replace(
              "this.pendingSystemic.length >= this.policy.systemic_threshold",
              "this.pendingSystemic.length > this.policy.systemic_threshold",
              1,
          )
          assert broken != source, "the mutation did not apply; update this step"
          path.write_text(broken)
          PY
          if ./scripts/check.sh > /tmp/mutant-ts.txt 2>&1; then
            echo "check.sh passed against a broken TypeScript breaker. The gates are not asserting the trip rule."
            cat /tmp/mutant-ts.txt
            exit 1
          fi
          if ! grep -q '  FAIL  typescript runner exited' /tmp/mutant-ts.txt || ! grep -qF 'FAIL [trip_at_threshold_three_rate_limit] field=state.tripped' /tmp/mutant-ts.txt; then
            echo "check.sh failed, but typescript did not report trip_at_threshold_three_rate_limit (state.tripped); the mutation is not what it caught."
            cat /tmp/mutant-ts.txt
            exit 1
          fi
          echo "check.sh caught the TypeScript mutation, as it must:"
          grep '  FAIL  ' /tmp/mutant-ts.txt
          git checkout -- ts/breaker.ts

      # Canonicalization is where the two languages drift apart silently: Python
      # sorts strings by code point, JavaScript by UTF-16 code unit, and they
      # disagree exactly when a non-BMP key meets one in U+E000-U+FFFF.
      - name: Sort Python map keys by code point, then expect check.sh to fail
        run: |
          python - <<'PY'
          import pathlib
          path = pathlib.Path("py/haltrule/checkpoint.py")
          source = path.read_text()
          broken = source.replace(
              "keys = sorted(value, key=_utf16_key)",
              "keys = sorted(value)",
              1,
          )
          assert broken != source, "the mutation did not apply; update this step"
          path.write_text(broken)
          PY
          if ./scripts/check.sh > /tmp/mutant-py-canon.txt 2>&1; then
            echo "check.sh passed with Python sorting keys by code point. The fixtures are not pinning UTF-16 key order."
            cat /tmp/mutant-py-canon.txt
            exit 1
          fi
          if ! grep -q '  FAIL  python runner exited' /tmp/mutant-py-canon.txt || ! grep -qF 'FAIL [key_order_non_bmp_before_private_use] field=canonicalize.expect' /tmp/mutant-py-canon.txt; then
            echo "check.sh failed, but python did not report key_order_non_bmp_before_private_use (canonicalize.expect); the mutation is not what it caught."
            cat /tmp/mutant-py-canon.txt
            exit 1
          fi
          echo "check.sh caught the Python key-order mutation, as it must:"
          grep '  FAIL  ' /tmp/mutant-py-canon.txt
          git checkout -- py/haltrule/checkpoint.py

      # The same divergence in the reuse verdict: dependency issues are listed
      # in UTF-16 key order, which a code-point sort breaks only for non-BMP ids.
      - name: Sort Python dependency ids by code point, then expect check.sh to fail
        run: |
          python - <<'PY'
          import pathlib
          path = pathlib.Path("py/haltrule/checkpoint.py")
          source = path.read_text()
          broken = source.replace(
              "for dependency_id in sorted(expected_dependencies, key=_utf16_key):",
              "for dependency_id in sorted(expected_dependencies):",
              1,
          )
          assert broken != source, "the mutation did not apply; update this step"
          path.write_text(broken)
          PY
          if ./scripts/check.sh > /tmp/mutant-py-deps.txt 2>&1; then
            echo "check.sh passed with Python ordering dependency ids by code point. The fixtures are not pinning UTF-16 order."
            cat /tmp/mutant-py-deps.txt
            exit 1
          fi
          if ! grep -q '  FAIL  python runner exited' /tmp/mutant-py-deps.txt || ! grep -qF 'FAIL [dependency_order_utf16_not_code_point] field=checkpoint.expect' /tmp/mutant-py-deps.txt; then
            echo "check.sh failed, but python did not report dependency_order_utf16_not_code_point (checkpoint.expect); the mutation is not what it caught."
            cat /tmp/mutant-py-deps.txt
            exit 1
          fi
          echo "check.sh caught the Python dependency-order mutation, as it must:"
          grep '  FAIL  ' /tmp/mutant-py-deps.txt
          git checkout -- py/haltrule/checkpoint.py

      - name: Let TypeScript canonicalize fractional numbers, then expect check.sh to fail
        run: |
          python - <<'PY'
          import pathlib
          path = pathlib.Path("ts/checkpoint.ts")
          source = path.read_text()
          broken = source.replace(
              "if (!Number.isFinite(value) || !Number.isInteger(value)) {",
              "if (!Number.isFinite(value)) {",
              1,
          )
          assert broken != source, "the mutation did not apply; update this step"
          path.write_text(broken)
          PY
          if ./scripts/check.sh > /tmp/mutant-ts-canon.txt 2>&1; then
            echo "check.sh passed with TypeScript accepting 1.5. The fixtures are not pinning float rejection."
            cat /tmp/mutant-ts-canon.txt
            exit 1
          fi
          if ! grep -q '  FAIL  typescript runner exited' /tmp/mutant-ts-canon.txt || ! grep -qF 'FAIL [fraction] field=canonicalize.expect' /tmp/mutant-ts-canon.txt; then
            echo "check.sh failed, but typescript did not report fraction (canonicalize.expect); the mutation is not what it caught."
            cat /tmp/mutant-ts-canon.txt
            exit 1
          fi
          echo "check.sh caught the TypeScript float mutation, as it must:"
          grep '  FAIL  ' /tmp/mutant-ts-canon.txt
          git checkout -- ts/checkpoint.ts

      # The next two protect fixtures whose value only the runner can build: an
      # array with a hole, and an integer past Python's int-to-str digit limit.
      # A runner that quietly built something tamer would pass every gate, so
      # the policy defect each fixture exists for must still be caught end to end.
      - name: Let TypeScript skip array holes, then expect check.sh to fail
        run: |
          python - <<'PY'
          import pathlib
          path = pathlib.Path("ts/checkpoint.ts")
          source = path.read_text()
          broken = source.replace(
              "    for (let index = 0; index < value.length; index += 1) {\n      parts.push",
              "    for (let index = 0; index < value.length; index += 1) {\n      if (!(index in value)) continue;\n      parts.push",
              1,
          )
          assert broken != source, "the mutation did not apply; update this step"
          path.write_text(broken)
          PY
          if ./scripts/check.sh > /tmp/mutant-ts-holes.txt 2>&1; then
            echo "check.sh passed with TypeScript dropping array holes. The sparse_array fixture is not pinning hole rejection."
            cat /tmp/mutant-ts-holes.txt
            exit 1
          fi
          if ! grep -q '  FAIL  typescript runner exited' /tmp/mutant-ts-holes.txt || ! grep -qF 'FAIL [sparse_array] field=canonicalize.expect' /tmp/mutant-ts-holes.txt; then
            echo "check.sh failed, but typescript did not report sparse_array (canonicalize.expect); the mutation is not what it caught."
            cat /tmp/mutant-ts-holes.txt
            exit 1
          fi
          echo "check.sh caught the TypeScript hole mutation, as it must:"
          grep '  FAIL  ' /tmp/mutant-ts-holes.txt
          git checkout -- ts/checkpoint.ts

      - name: Let Python spell out a huge integer in a halt message, then expect check.sh to fail
        run: |
          python - <<'PY'
          import pathlib
          path = pathlib.Path("py/haltrule/checkpoint.py")
          source = path.read_text()
          broken = source.replace(
              '            else f"a {value.bit_length()}-bit integer"\n',
              '            else f"{value}"\n',
              1,
          )
          assert broken != source, "the mutation did not apply; update this step"
          path.write_text(broken)
          PY
          if ./scripts/check.sh > /tmp/mutant-py-bigint.txt 2>&1; then
            echo "check.sh passed with Python raising on a 5001-digit integer. The bigint_5001_digits fixture is not reaching the digit limit."
            cat /tmp/mutant-py-bigint.txt
            exit 1
          fi
          if ! grep -q '  FAIL  python runner exited' /tmp/mutant-py-bigint.txt || ! grep -qF 'FAIL [bigint_5001_digits] field=canonicalize.raised' /tmp/mutant-py-bigint.txt; then
            echo "check.sh failed, but python did not report bigint_5001_digits (canonicalize.raised); the mutation is not what it caught."
            cat /tmp/mutant-py-bigint.txt
            exit 1
          fi
          echo "check.sh caught the Python digit-limit mutation, as it must:"
          grep '  FAIL  ' /tmp/mutant-py-bigint.txt
          git checkout -- py/haltrule/checkpoint.py
